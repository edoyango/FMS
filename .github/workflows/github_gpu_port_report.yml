# Tracks GPU-porting progress: builds FMS with gcov instrumentation, exercises it with the
# test_fms suite, then cross-references execution coverage against `do concurrent` / `!$omp
# target` ported regions (see .github/tools/track_gpu_port.py). Read-only: this job checks
# out and runs a PR's (possibly untrusted, fork-authored) code, so it must never hold write
# access. Posting the PR comment and publishing the HTML report happen in the separate
# github_gpu_port_comment.yml workflow, triggered by workflow_run, which runs with the base
# repository's permissions and does not check out PR code.

name: GPU port coverage report

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  gpu-port-report:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/noaa-gfdl/fms/fms-ci-rocky-gnu:15.1.0

    steps:
      - uses: actions/checkout@v4

      - name: Prepare GNU autoconf for build
        run: autoreconf -if

      - name: Configure the build with code coverage instrumentation
        run: |
          ./configure --with-yaml \
            FCFLAGS="$FCFLAGS -g -O0 --coverage" \
            CFLAGS="$CFLAGS -g -O0 --coverage" \
            LDFLAGS="$LDFLAGS --coverage" \
          || cat config.log

      # Build and run test_fms — the exercise step that produces .gcda. Test failures are
      # not fatal here: this job tracks porting coverage, not test correctness (that's
      # already covered by github_autotools_gnu.yml / github_cmake_gnu.yml), and a flaky or
      # unrelated failing test shouldn't block the whole coverage report.
      - name: Build and run the test_fms suite
        id: check
        continue-on-error: true
        run: make -j check

      - name: Show test failures (informational; does not fail this job)
        if: steps.check.outcome == 'failure'
        run: grep -RE "^FAIL:|^XPASS:" --include="*.log" . || true

      # Autotools compiles in-tree (no separate build dir), so each .gcno/.gcda lands next
      # to the .o it was compiled from. Running gcov from within each such directory writes
      # the matching .gcov alongside it, which track_gpu_port.py's --gcov-dir then finds via
      # a recursive search from the repo root.
      - name: Generate gcov reports
        run: |
          find . -name '*.gcda' -printf '%h\n' | sort -u | while read -r d; do
            ( cd "$d" && gcov -b ./*.gcda > /dev/null )
          done

      # List the .F90/.f90 files this PR actually touches, so the comment can report a
      # "this PR's files" subset in addition to the repo-wide total. Paths are left
      # repo-root-relative to match track_gpu_port.py's --src-root . output.
      - name: List source files changed by this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '*.F90' '*.f90' > changed_files.txt

      # Baseline for the "since base branch" delta: the GPU port JSON snapshot uploaded by
      # the most recent successful run of this workflow on the PR's base branch. This is an
      # approximation of the merge-base (not an exact rebuild of it), traded off deliberately
      # against not doubling CI cost with a second coverage build per PR. Uses
      # actions/github-script (not the `gh` CLI) so this doesn't depend on `gh` being present
      # in the container image.
      - name: Find latest GPU port snapshot on the base branch
        if: github.event_name == 'pull_request'
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'github_gpu_port_report.yml',
              branch: context.payload.pull_request.base.ref,
              status: 'success',
              per_page: 1,
            });
            const runId = runs.data.workflow_runs[0]?.id;
            if (runId) core.setOutput('run_id', String(runId));

      - name: Download baseline GPU port snapshot
        if: github.event_name == 'pull_request' && steps.baseline.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gpu-port-json
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
          path: baseline

      # --exclude test_fms: track porting progress in the FMS library itself, not in test
      # infrastructure that happens to use do concurrent / !$omp target to test offload
      # behavior (test_mpp_domains.F90, test_corner_mosaic.F90).
      - name: Generate GPU port coverage report
        run: |
          EXTRA_ARGS=()
          if [ -f baseline/gpu_port_report.json ]; then
            EXTRA_ARGS+=(--baseline-json baseline/gpu_port_report.json)
          fi
          if [ -f changed_files.txt ]; then
            EXTRA_ARGS+=(--changed-files changed_files.txt --out-comment gpu_port_comment.md)
          fi
          python3 .github/tools/track_gpu_port.py \
            --src-root . \
            --exclude test_fms \
            --gcov-dir . \
            --out-md gpu_port_report.md \
            --out-json gpu_port_report.json \
            --out-html gpu_port_html \
            --github-annotations \
            --verbose \
            "${EXTRA_ARGS[@]}"

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f gpu_port_report.md ]; then
            cat gpu_port_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-port-report
          path: gpu_port_report.md
          retention-days: 14
          if-no-files-found: ignore

      # Becomes the baseline snapshot the *next* PR against this branch diffs against —
      # uploaded on every run (push or PR) so pushes to the base branch keep it current.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-port-json
          path: gpu_port_report.json
          retention-days: 30
          if-no-files-found: ignore

      # gpu_port_comment.md is picked up and posted/updated on the PR itself by
      # github_gpu_port_comment.yml, which runs via workflow_run so it has write access even
      # for PRs from forks (this job intentionally does not — see permissions: above).
      - name: Save PR number for the comment workflow
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr_number.txt

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: gpu-port-pr-comment
          path: |
            gpu_port_comment.md
            pr_number.txt
          retention-days: 1
          if-no-files-found: ignore

      # Picked up by github_gpu_port_comment.yml (via workflow_run, so it has write access)
      # and published to the gh-pages branch under pr-<number>/, then linked from the PR
      # comment above.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: gpu-port-html
          path: |
            gpu_port_html
            pr_number.txt
          retention-days: 1
          if-no-files-found: ignore
